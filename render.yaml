# Blueprint de Render: New + > Blueprint > seleccione este repositorio.
services:
  - type: web
    name: auditor-academico
    runtime: python
    plan: starter            # 'free' funciona, pero se suspende tras inactividad
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --worker-class gthread --timeout 180 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: OPENALEX_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: API_KEYS
        sync: false
      - key: CORS_ORIGINS
        value: ""
      - key: RATE_LIMIT_PER_MIN
        value: "20"
    # --- Proyectos guardados en el servidor -------------------------------------------
    # Plan gratuito: el disco es efímero; los proyectos del servidor se pierden en cada
    # redeploy/reinicio (la copia del navegador se conserva). Con plan de pago, descomente
    # estas líneas para usar un disco persistente:
    #  - key: PROJECTS_DB_PATH
    #    value: /var/data/projects.sqlite3
    # disk:
    #   name: auditor-data
    #   mountPath: /var/data
    #   sizeGB: 1
